services:
  postgres:
    image: postgres:16-alpine
    container_name: shortener_db_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: shortener_url
    ports:
      - "5433:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d shortener_url"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shortener_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  drmq:
    image: 0xuell/drmq:latest
    container_name: shortener_drmq
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9292:9292"
      - "9392:9392"
      - "9096:9096"
    environment:
      - NODE_ID=standalone
      - PORT=9092
    volumes:
      - drmq_data:/data

  drmq-dashboard:
    image: 0xuell/drmq-dashboard:latest
    container_name: shortener_drmq_dashboard
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - drmq

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortener_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      drmq:
        condition: service_started
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://test_user:test_password@postgres:5432/shortener_url?sslmode=disable
      REDIS_URL: redis://redis:6379
      DRMQ_BOOTSTRAP_SERVERS: drmq:9092
      DRMQ_CLICK_TOPIC: url-clicks
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-for-development-12345}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: shortener_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    container_name: shortener_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  redis_data:
  drmq_data:
  prometheus_data:
  grafana_data: